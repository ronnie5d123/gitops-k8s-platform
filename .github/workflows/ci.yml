
name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Run automated tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t gitops-k8s-platform:test .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gitops-k8s-platform:test
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Extract image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch


      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


      - name: Update Helm chart image tag
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python -c "from pathlib import Path; import os, re; p=Path('gitops-app/values.yaml'); s=p.read_text(); s,n=re.subn(r'(?m)^(\s*tag:\s*).+$', lambda m: m.group(1) + '\"' + os.environ['IMAGE_TAG'] + '\"', s, count=1); assert n == 1, 'Could not find image tag in values.yaml'; p.write_text(s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops-app/values.yaml
          git diff --cached --quiet || (git commit -m "chore: update image tag to ${IMAGE_TAG}" && git push)
