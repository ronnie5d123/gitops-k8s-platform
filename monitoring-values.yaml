defaultRules:
  create: false

alertmanager:
  enabled: false

grafana:
  enabled: true
  persistence:
    enabled: false

  livenessProbe:
    initialDelaySeconds: 180
    timeoutSeconds: 5
    failureThreshold: 10

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
